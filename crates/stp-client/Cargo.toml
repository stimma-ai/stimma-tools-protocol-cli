[package]
name = "stp-client"
description = "Stimma Tools Protocol (STP) host client library"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.22.1"
futures-util = "0.3.32"
jsonschema = { version = "0.33.0", default-features = false }
rand = "0.9.4"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "http2", "charset", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt", "macros", "io-util", "io-std", "net", "process", "sync", "time", "signal"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
tokio-util = "0.7.18"
tracing = "0.1.44"
url = "2.5.8"
